<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Download YouTube videos in the best quality — free, fast, no signup." />
  <title>YT Downloader</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Base ────────────────────────────────────────────── */
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      overflow-x: hidden;
      color: #e5e5e5;
      background: #07000f;
    }

    /* ── Background gradient mesh ────────────────────────── */
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(ellipse 70% 55% at 12% 18%, rgba(220,0,0,0.22)   0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 88% 82%, rgba(130,0,240,0.18) 0%, transparent 60%),
        radial-gradient(ellipse 55% 45% at 72% 15%, rgba(0,40,200,0.13)  0%, transparent 60%),
        radial-gradient(ellipse 80% 70% at 50% 50%, rgba(30,0,60,0.6)    0%, transparent 80%),
        #07000f;
      animation: bgPulse 25s ease-in-out infinite alternate;
    }
    @keyframes bgPulse {
      0%   { filter: hue-rotate(0deg)   brightness(1);   }
      50%  { filter: hue-rotate(10deg)  brightness(1.05); }
      100% { filter: hue-rotate(-5deg)  brightness(0.97); }
    }

    /* ── Floating orbs ───────────────────────────────────── */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(75px);
      pointer-events: none;
      z-index: 0;
      animation: orbDrift ease-in-out infinite alternate;
    }
    .orb-1 { width:620px; height:620px; background:radial-gradient(circle,rgba(255,20,20,.24),transparent 65%);  top:-220px; left:-180px;  animation-duration:24s; }
    .orb-2 { width:520px; height:520px; background:radial-gradient(circle,rgba(150,0,255,.2), transparent 65%);  bottom:-180px; right:-160px; animation-duration:20s; animation-direction:alternate-reverse; }
    .orb-3 { width:380px; height:380px; background:radial-gradient(circle,rgba(0,60,255,.14), transparent 65%);  top:45%; left:60%;        animation-duration:30s; }
    .orb-4 { width:280px; height:280px; background:radial-gradient(circle,rgba(255,90,0,.16), transparent 65%);  top:18%; right:8%;        animation-duration:17s; animation-direction:alternate-reverse; }
    @keyframes orbDrift {
      0%   { transform: translate(0,0)        scale(1);    }
      33%  { transform: translate(55px,-45px) scale(1.08); }
      66%  { transform: translate(-35px,55px) scale(0.93); }
      100% { transform: translate(45px,35px)  scale(1.05); }
    }

    /* ── Dot-grid overlay ────────────────────────────────── */
    .dots {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image: radial-gradient(circle, rgba(255,255,255,.055) 1px, transparent 1px);
      background-size: 30px 30px;
    }

    /* ── Card ────────────────────────────────────────────── */
    .card {
      position: relative; z-index: 1;
      width: 100%; max-width: 640px;
      background: linear-gradient(145deg, rgba(255,255,255,.075) 0%, rgba(15,4,30,.88) 100%);
      backdrop-filter: blur(50px) saturate(180%);
      -webkit-backdrop-filter: blur(50px) saturate(180%);
      border: 1px solid rgba(255,255,255,.11);
      border-radius: 28px;
      padding: 2.5rem 2.5rem 2.25rem;
      box-shadow:
        0 0 0 1px rgba(255,30,30,.07),
        0 60px 120px -20px rgba(0,0,0,.85),
        0 0 100px -15px rgba(200,0,0,.2),
        inset 0 1px 0 rgba(255,255,255,.13),
        inset 0 -1px 0 rgba(0,0,0,.35);
      transition: transform 0.08s ease-out, box-shadow 0.08s ease-out;
      transform-style: preserve-3d;
      animation: cardIn .6s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes cardIn {
      from { opacity:0; transform:translateY(44px) scale(.95) rotateX(6deg); }
      to   { opacity:1; transform:translateY(0)    scale(1)   rotateX(0deg); }
    }
    /* Top accent glow line */
    .card::before {
      content:''; position:absolute;
      top:0; left:12%; right:12%; height:1px;
      background: linear-gradient(90deg, transparent, rgba(255,70,70,.85), rgba(255,160,0,.5), transparent);
      border-radius:1px;
    }

    /* ── Header ──────────────────────────────────────────── */
    .header { display:flex; align-items:center; gap:1.1rem; margin-bottom:2rem; }

    .logo {
      flex-shrink:0; width:54px; height:54px;
      background: linear-gradient(140deg, #ff3030, #cc0000, #880000);
      border-radius:17px;
      display:flex; align-items:center; justify-content:center;
      box-shadow: 0 8px 26px rgba(255,0,0,.55), 0 2px 6px rgba(0,0,0,.55),
                  inset 0 1px 0 rgba(255,190,190,.3);
      animation: logoPulse 3.5s ease-in-out infinite;
    }
    @keyframes logoPulse {
      0%,100% { box-shadow: 0 8px 26px rgba(255,0,0,.55), 0 2px 6px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,190,190,.3); }
      50%     { box-shadow: 0 8px 38px rgba(255,0,0,.75), 0 2px 6px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,190,190,.3); }
    }
    .logo svg { width:24px; height:24px; }

    .htext h1 {
      font-size:1.6rem; font-weight:800; letter-spacing:-.035em;
      background: linear-gradient(130deg, #fff 0%, #ffdddd 45%, #ff9090 100%);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
    }
    .htext p { font-size:.82rem; color:rgba(255,255,255,.32); margin-top:3px; }

    /* ── URL row ─────────────────────────────────────────── */
    .url-row { display:flex; gap:.6rem; }
    .iw { flex:1; position:relative; }
    .iw svg {
      position:absolute; left:1rem; top:50%; transform:translateY(-50%);
      width:16px; height:16px; color:rgba(255,255,255,.22);
      pointer-events:none; transition:color .2s; z-index:1;
    }
    .iw:focus-within svg { color:rgba(255,100,100,.7); }
    .url-input {
      width:100%;
      padding:.85rem 1rem .85rem 2.75rem;
      background:rgba(255,255,255,.05);
      border:1px solid rgba(255,255,255,.1);
      border-radius:14px; color:#fff; font-size:.9rem; outline:none;
      transition:border-color .25s, background .25s, box-shadow .25s;
    }
    .url-input::placeholder { color:rgba(255,255,255,.2); }
    .url-input:focus {
      background:rgba(255,255,255,.08);
      border-color:rgba(255,60,60,.6);
      box-shadow:0 0 0 3px rgba(255,0,0,.1), 0 0 22px rgba(255,0,0,.07);
    }

    /* ── Buttons ─────────────────────────────────────────── */
    .btn {
      display:inline-flex; align-items:center; justify-content:center; gap:.45rem;
      border:none; font-family:inherit; font-weight:700; cursor:pointer;
      position:relative; overflow:hidden; white-space:nowrap;
      transition:transform .2s cubic-bezier(.34,1.56,.64,1), box-shadow .2s;
    }
    .btn::after { content:''; position:absolute; inset:0; background:rgba(255,255,255,0); transition:background .15s; }
    .btn:not(:disabled):hover::after { background:rgba(255,255,255,.08); }
    .btn:active { transform:scale(.95) !important; }
    .btn:disabled { opacity:.32; cursor:not-allowed; transform:none !important; box-shadow:none !important; }

    .btn-check {
      padding:.85rem 1.4rem; font-size:.9rem; border-radius:14px;
      background:linear-gradient(135deg,#ff2828,#cc0000,#990000); color:#fff;
      box-shadow:0 6px 22px rgba(255,0,0,.42), 0 2px 6px rgba(0,0,0,.45),
                 inset 0 1px 0 rgba(255,170,170,.3);
    }
    .btn-check:not(:disabled):hover {
      transform:translateY(-3px) scale(1.03);
      box-shadow:0 12px 30px rgba(255,0,0,.52), 0 4px 10px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,170,170,.3);
    }

    /* ── Divider ─────────────────────────────────────────── */
    .divider { display:flex; align-items:center; gap:.75rem; margin:1.75rem 0 1.25rem; }
    .divider::before,.divider::after {
      content:''; flex:1; height:1px;
      background:linear-gradient(90deg,transparent,rgba(255,255,255,.1),transparent);
    }
    .div-label { font-size:.68rem; font-weight:700; color:rgba(255,255,255,.25); text-transform:uppercase; letter-spacing:.12em; }

    /* ── Video info ──────────────────────────────────────── */
    .vinfo {
      padding:1rem 1.1rem;
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.08);
      border-radius:14px; margin-bottom:1.4rem;
      position:relative; overflow:hidden;
    }
    .vinfo::before {
      content:''; position:absolute; left:0; top:0; bottom:0; width:3px;
      background:linear-gradient(180deg,#ff2020,#ff6600); border-radius:2px 0 0 2px;
    }
    .vtitle {
      font-size:.9rem; font-weight:500; color:#fff; line-height:1.45;
      overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
      padding-left:.55rem;
    }
    .vdur { font-size:.75rem; color:rgba(255,255,255,.32); margin-top:.3rem; padding-left:.55rem; }

    /* ── Quality grid ────────────────────────────────────── */
    .qlabel { font-size:.69rem; font-weight:700; color:rgba(255,255,255,.28); text-transform:uppercase; letter-spacing:.12em; margin-bottom:.75rem; }

    .fgrid {
      display:grid;
      grid-template-columns:repeat(auto-fill, minmax(105px,1fr));
      gap:.65rem;
      margin-bottom:1.5rem;
    }

    .fcard {
      position:relative;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      padding:1.15rem .5rem .95rem;
      background:linear-gradient(145deg,rgba(255,255,255,.075),rgba(255,255,255,.02));
      border:1px solid rgba(255,255,255,.1);
      border-radius:16px;
      cursor:pointer; user-select:none;
      transition:border-color .15s, background .15s, box-shadow .15s;
      transform-style:preserve-3d; will-change:transform;
      animation:fcIn .4s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes fcIn { from{opacity:0;transform:translateY(14px) scale(.9)} to{opacity:1;transform:none} }
    .fcard input[type=radio] { display:none; }
    /* glossy top edge */
    .fcard::before {
      content:''; position:absolute; top:0; left:12%; right:12%; height:1px;
      background:linear-gradient(90deg,transparent,rgba(255,255,255,.28),transparent);
    }

    .fcard.sel {
      border-color:rgba(255,55,55,.7);
      background:linear-gradient(145deg,rgba(255,20,20,.2),rgba(160,0,0,.09));
      box-shadow:0 0 0 1px rgba(255,60,60,.22), 0 12px 32px rgba(0,0,0,.45), 0 0 34px rgba(255,0,0,.22);
    }
    .fcard.sel::after { content:'✓'; position:absolute; top:7px; right:9px; font-size:.58rem; font-weight:900; color:#ff6060; }

    .fres { font-size:1.15rem; font-weight:800; color:#fff; letter-spacing:-.02em; }
    .fcard.sel .fres {
      background:linear-gradient(135deg,#ff9090,#ff4040);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
    }
    .fsz { font-size:.68rem; color:rgba(255,255,255,.33); margin-top:.25rem; font-weight:500; }
    .fcard.sel .fsz { color:rgba(255,130,130,.55); }

    /* ── Download button ─────────────────────────────────── */
    .btn-dl {
      width:100%; padding:1.05rem 1.5rem; font-size:1rem; letter-spacing:.01em;
      border-radius:16px;
      background:linear-gradient(135deg,#ff2828 0%,#cc0000 50%,#8a0000 100%); color:#fff;
      box-shadow:0 8px 26px rgba(255,0,0,.42), 0 3px 8px rgba(0,0,0,.55),
                 inset 0 1px 0 rgba(255,140,140,.25), inset 0 -1px 0 rgba(0,0,0,.25);
    }
    .btn-dl:not(:disabled):hover {
      transform:translateY(-4px) scale(1.01);
      box-shadow:0 16px 40px rgba(255,0,0,.52), 0 6px 16px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,140,140,.3);
    }
    .btn-dl:disabled {
      background:linear-gradient(135deg,rgba(55,55,55,.55),rgba(35,35,35,.45));
    }

    /* ── Status ──────────────────────────────────────────── */
    .sbox {
      margin-top:1.1rem; padding:.9rem 1.1rem;
      border-radius:14px; font-size:.875rem; line-height:1.55;
      animation:fadeUp .25s ease both;
    }
    @keyframes fadeUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
    .sbox.info    { background:rgba(18,55,180,.2);  border:1px solid rgba(60,120,255,.28); color:#90bbff; }
    .sbox.success { background:rgba(10,100,40,.22); border:1px solid rgba(30,200,80,.3);   color:#72ea85; }
    .sbox.error   { background:rgba(180,18,18,.2);  border:1px solid rgba(255,60,60,.3);   color:#ff9090; }

    /* ── Spinner ─────────────────────────────────────────── */
    .sp {
      display:inline-block; width:13px; height:13px;
      border:2px solid currentColor; border-top-color:transparent;
      border-radius:50%; animation:rot .65s linear infinite;
      margin-right:7px; vertical-align:middle;
    }
    @keyframes rot { to{transform:rotate(360deg)} }

    .hidden { display:none !important; }

    /* ── Search bar ──────────────────────────────────────── */
    .search-row { display:flex; gap:.6rem; margin-bottom:1.4rem; }
    .search-iw { flex:1; position:relative; }
    .search-iw svg {
      position:absolute; left:1rem; top:50%; transform:translateY(-50%);
      width:15px; height:15px; color:rgba(255,255,255,.22);
      pointer-events:none; transition:color .2s;
    }
    .search-iw:focus-within svg { color:rgba(255,100,100,.7); }
    .search-input {
      width:100%;
      padding:.85rem 1rem .85rem 2.6rem;
      background:rgba(255,255,255,.05);
      border:1px solid rgba(255,255,255,.1);
      border-radius:14px; color:#fff; font-size:.9rem; outline:none;
      transition:border-color .25s, background .25s, box-shadow .25s;
    }
    .search-input::placeholder { color:rgba(255,255,255,.2); }
    .search-input:focus {
      background:rgba(255,255,255,.08);
      border-color:rgba(255,60,60,.6);
      box-shadow:0 0 0 3px rgba(255,0,0,.1);
    }
    .btn-search {
      padding:.85rem 1.25rem; font-size:.9rem; border-radius:14px;
      background:linear-gradient(135deg,rgba(255,255,255,.12),rgba(255,255,255,.04));
      color:#fff; border:1px solid rgba(255,255,255,.15);
      box-shadow:0 4px 14px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.1);
    }
    .btn-search:not(:disabled):hover {
      transform:translateY(-2px) scale(1.03);
      background:linear-gradient(135deg,rgba(255,255,255,.18),rgba(255,255,255,.07));
      box-shadow:0 8px 22px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.15);
    }

    /* ── Search results ──────────────────────────────────── */
    #searchResults {
      display:none;
      flex-direction:column;
      gap:.55rem;
      margin-bottom:1.4rem;
      max-height:360px;
      overflow-y:auto;
      padding-right:4px;
    }
    #searchResults::-webkit-scrollbar { width:4px; }
    #searchResults::-webkit-scrollbar-track { background:transparent; }
    #searchResults::-webkit-scrollbar-thumb { background:rgba(255,255,255,.15); border-radius:2px; }

    .sresult {
      display:flex; gap:.85rem; align-items:center;
      padding:.7rem .85rem;
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.08);
      border-radius:14px;
      cursor:pointer;
      transition:background .15s, border-color .15s, transform .15s;
      animation:fadeUp .3s ease both;
    }
    .sresult:hover {
      background:rgba(255,255,255,.08);
      border-color:rgba(255,60,60,.35);
      transform:translateX(3px);
    }
    .sresult.active {
      background:rgba(255,20,20,.12);
      border-color:rgba(255,60,60,.55);
    }
    .sresult-thumb {
      flex-shrink:0; width:90px; height:54px;
      border-radius:9px; object-fit:cover;
      background:#111;
    }
    .sresult-info { flex:1; min-width:0; }
    .sresult-title {
      font-size:.84rem; font-weight:600; color:#fff;
      line-height:1.4;
      overflow:hidden; display:-webkit-box;
      -webkit-line-clamp:2; -webkit-box-orient:vertical;
    }
    .sresult-meta {
      font-size:.7rem; color:rgba(255,255,255,.35);
      margin-top:.25rem; display:flex; gap:.6rem;
    }
    .sresult-dur {
      background:rgba(0,0,0,.55); border-radius:4px;
      padding:1px 5px; font-size:.68rem; color:rgba(255,255,255,.7);
      position:absolute; bottom:4px; right:4px;
    }
    .sresult-thumb-wrap { position:relative; flex-shrink:0; }

    /* ── Progress bar ─────────────────────────────────────── */
    .prog-wrap {
      margin-top:1.1rem;
      padding:1rem 1.15rem;
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.08);
      border-radius:14px;
      animation:fadeUp .25s ease both;
    }
    .prog-header {
      display:flex; justify-content:space-between; align-items:center;
      margin-bottom:.6rem;
    }
    .prog-label {
      font-size:.8rem; font-weight:600; color:rgba(255,255,255,.6);
      display:flex; align-items:center; gap:.45rem;
    }
    .prog-pct {
      font-size:.85rem; font-weight:800;
      background:linear-gradient(135deg,#ff8080,#ff3030);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
    }
    .prog-track {
      height:7px;
      background:rgba(255,255,255,.07);
      border-radius:99px;
      overflow:hidden;
      margin-bottom:.65rem;
      position:relative;
    }
    .prog-bar {
      height:100%;
      background:linear-gradient(90deg,#cc0000,#ff4500,#ff9900);
      border-radius:99px;
      width:0%;
      transition:width .5s cubic-bezier(.4,0,.2,1);
      position:relative;
      overflow:hidden;
    }
    .prog-bar::after {
      content:'';
      position:absolute; inset:0;
      background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,.35) 50%,transparent 100%);
      animation:shimmer 1.6s ease-in-out infinite;
    }
    @keyframes shimmer {
      0%   { transform:translateX(-100%); }
      100% { transform:translateX(250%); }
    }
    .prog-meta {
      display:flex; justify-content:space-between;
      font-size:.72rem; color:rgba(255,255,255,.33);
    }
    .prog-meta span { display:flex; flex-direction:column; align-items:center; gap:.1rem; }
    .prog-meta .pm-val { font-size:.78rem; font-weight:600; color:rgba(255,255,255,.55); }
    .prog-meta .pm-key { font-size:.63rem; text-transform:uppercase; letter-spacing:.08em; }

    @media(max-width:500px){
      .card { padding:1.75rem 1.25rem; }
      .fgrid { grid-template-columns:repeat(3,1fr); }
      .htext h1 { font-size:1.25rem; }
      .sresult-thumb { width:70px; height:42px; }
    }
  </style>
</head>
<body>

<div class="bg"></div>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>
<div class="orb orb-4"></div>
<div class="dots"></div>

<div class="card" id="card">

  <!-- Header -->
  <div class="header">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="10" fill="rgba(255,255,255,0.13)"/>
        <polygon points="9.5,7 9.5,17 17.5,12" fill="white"/>
      </svg>
    </div>
    <div class="htext">
      <h1>YT Downloader</h1>
      <p>Download YouTube videos in your preferred quality</p>
    </div>
  </div>

  <!-- Search bar -->
  <div class="search-row">
    <div class="search-iw">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input class="search-input" type="text" id="searchQ"
        placeholder="Search YouTube videos…" autocomplete="off" spellcheck="false"/>
    </div>
    <button class="btn btn-search" id="searchBtn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      Search
    </button>
  </div>

  <!-- Search results -->
  <div id="searchResults"></div>

  <!-- Divider -->
  <div class="divider"><span class="div-label">or paste URL directly</span></div>

  <!-- URL input -->
  <div class="url-row">
    <div class="iw">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/>
        <path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/>
      </svg>
      <input class="url-input" type="text" id="url"
        placeholder="Paste YouTube URL here…" autocomplete="off" spellcheck="false"/>
    </div>
    <button class="btn btn-check" id="checkBtn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      Check
    </button>
  </div>

  <!-- Quality section -->
  <div id="qsec" class="hidden">
    <div class="divider"><span class="div-label">Video Info</span></div>
    <div class="vinfo">
      <div class="vtitle" id="vtitle"></div>
      <div class="vdur"   id="vdur"></div>
    </div>
    <div class="qlabel">Select Quality</div>
    <div class="fgrid" id="fgrid"></div>
    <button class="btn btn-dl" id="dlBtn" disabled>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
      <span id="dlTxt">Select a quality first</span>
    </button>
  </div>

  <div class="sbox hidden" id="sbox"></div>

  <!-- Progress bar (shown while downloading) -->
  <div id="progSec" class="hidden">
    <div class="prog-wrap">
      <div class="prog-header">
        <span class="prog-label">
          <span class="sp"></span>
          <span id="progPhase">Downloading…</span>
        </span>
        <span class="prog-pct" id="progPct">0%</span>
      </div>
      <div class="prog-track">
        <div class="prog-bar" id="progBar"></div>
      </div>
      <div class="prog-meta">
        <span><span class="pm-val" id="progDl">—</span><span class="pm-key">Downloaded</span></span>
        <span><span class="pm-val" id="progSpd">—</span><span class="pm-key">Speed</span></span>
        <span><span class="pm-val" id="progEta">—</span><span class="pm-key">ETA</span></span>
      </div>
    </div>
  </div>
</div>

<script>
  const urlEl       = document.getElementById('url');
  const checkBtn    = document.getElementById('checkBtn');
  const qsec        = document.getElementById('qsec');
  const vtitle      = document.getElementById('vtitle');
  const vdur        = document.getElementById('vdur');
  const fgrid       = document.getElementById('fgrid');
  const dlBtn       = document.getElementById('dlBtn');
  const dlTxt       = document.getElementById('dlTxt');
  const sbox        = document.getElementById('sbox');
  const card        = document.getElementById('card');
  const searchQ     = document.getElementById('searchQ');
  const searchBtn   = document.getElementById('searchBtn');
  const searchRes   = document.getElementById('searchResults');
  const progSec     = document.getElementById('progSec');
  const progBar     = document.getElementById('progBar');
  const progPct     = document.getElementById('progPct');
  const progPhase   = document.getElementById('progPhase');
  const progDl      = document.getElementById('progDl');
  const progSpd     = document.getElementById('progSpd');
  const progEta     = document.getElementById('progEta');

  let selFmt = null, pollTimer = null;

  /* ── Byte / time formatters ── */
  function fmtBytes(b) {
    if (!b || b <= 0) return '—';
    if (b < 1024)        return b + ' B';
    if (b < 1048576)     return (b / 1024).toFixed(1) + ' KB';
    if (b < 1073741824)  return (b / 1048576).toFixed(1) + ' MB';
    return (b / 1073741824).toFixed(2) + ' GB';
  }
  function fmtEta(s) {
    if (!s || s <= 0) return '—';
    if (s < 60) return s + 's';
    const m = Math.floor(s / 60), sc = s % 60;
    return m + ':' + String(sc).padStart(2, '0');
  }
  function resetProgress() {
    progBar.style.width = '0%';
    progPct.textContent = '0%';
    progDl.textContent = progSpd.textContent = progEta.textContent = '—';
    progPhase.textContent = 'Downloading…';
    progSec.classList.add('hidden');
  }

  /* ── Search ── */
  searchBtn.addEventListener('click', doSearch);
  searchQ.addEventListener('keydown', e => e.key === 'Enter' && doSearch());

  async function doSearch() {
    const q = searchQ.value.trim();
    if (!q) return;
    searchBtn.disabled = true;
    searchBtn.innerHTML = `<span class="sp"></span>Searching…`;
    searchRes.style.display = 'none';
    searchRes.innerHTML = '';
    try {
      const res  = await fetch('/search?q=' + encodeURIComponent(q) + '&max_results=8');
      const data = await res.json();
      if (!res.ok || !data.results?.length) {
        st(data.error || 'No results found.', 'error'); return;
      }
      renderSearchResults(data.results);
    } catch {
      st('Search failed — is the server running?', 'error');
    } finally {
      searchBtn.disabled = false;
      searchBtn.innerHTML =
        `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>Search`;
    }
  }

  function renderSearchResults(results) {
    searchRes.innerHTML = '';
    results.forEach((v, i) => {
      const el = document.createElement('div');
      el.className = 'sresult';
      el.style.animationDelay = `${i * 45}ms`;
      el.innerHTML =
        `<div class="sresult-thumb-wrap">` +
          `<img class="sresult-thumb" src="${esc(v.thumbnail)}" alt="" loading="lazy" onerror="this.style.background='#222'">` +
          (v.duration ? `<span class="sresult-dur">${esc(v.duration)}</span>` : '') +
        `</div>` +
        `<div class="sresult-info">` +
          `<div class="sresult-title">${esc(v.title)}</div>` +
          `<div class="sresult-meta"><span>${esc(v.channel)}</span></div>` +
        `</div>`;
      el.addEventListener('click', () => {
        document.querySelectorAll('.sresult').forEach(r => r.classList.remove('active'));
        el.classList.add('active');
        urlEl.value = v.url;
        // Auto-trigger check
        qsec.classList.add('hidden');
        clrSt();
        check();
        // Scroll to URL row
        urlEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
      });
      searchRes.appendChild(el);
    });
    searchRes.style.display = 'flex';
  }

  /* ── Helpers ── */
  function st(html, type) {
    sbox.innerHTML = html;
    sbox.className = 'sbox ' + type;
    sbox.classList.remove('hidden');
  }
  function clrSt() { sbox.classList.add('hidden'); }
  function dur(s) {
    if (!s) return '';
    const h=Math.floor(s/3600), m=Math.floor((s%3600)/60), sc=Math.floor(s%60);
    return h ? `${h}:${p2(m)}:${p2(sc)}` : `${m}:${p2(sc)}`;
  }
  const p2 = n => String(n).padStart(2,'0');
  function esc(s) {
    return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  /* ── Main card 3-D tilt ── */
  let ticking = false;
  document.addEventListener('mousemove', e => {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(() => {
      const r  = card.getBoundingClientRect();
      const cx = r.left + r.width  / 2;
      const cy = r.top  + r.height / 2;
      const dx = (e.clientX - cx) / (window.innerWidth  / 2);
      const dy = (e.clientY - cy) / (window.innerHeight / 2);
      card.style.transform = `perspective(1100px) rotateY(${dx*3.5}deg) rotateX(${-dy*2.5}deg)`;
      ticking = false;
    });
  });
  document.addEventListener('mouseleave', () => { card.style.transform = ''; });

  /* ── Step 1: Check ── */
  checkBtn.addEventListener('click', check);
  urlEl.addEventListener('keydown', e => e.key === 'Enter' && check());

  async function check() {
    const url = urlEl.value.trim();
    if (!url) { st('Please enter a YouTube URL.', 'error'); return; }

    checkBtn.disabled = true;
    checkBtn.innerHTML = `<span class="sp"></span>Checking…`;
    qsec.classList.add('hidden');
    st('<span class="sp"></span>Fetching available qualities…', 'info');

    try {
      const res  = await fetch('/formats?url=' + encodeURIComponent(url));
      const data = await res.json();

      if (!res.ok)           { st('⚠ ' + esc(data.error || 'Could not fetch formats.'), 'error'); return; }
      if (!data.formats?.length) { st('No downloadable formats found.', 'error'); return; }

      vtitle.textContent = data.title;
      vdur.textContent   = data.duration ? '⏱ ' + dur(data.duration) : '';

      fgrid.innerHTML = '';
      selFmt = null;
      dlBtn.disabled = true;
      dlTxt.textContent = 'Select a quality first';

      data.formats.forEach((fmt, i) => {
        const fc = document.createElement('label');
        fc.className = 'fcard';
        fc.style.animationDelay = `${i * 65}ms`;
        fc.innerHTML =
          `<input type="radio" name="q" value="${esc(fmt.format_key)}">` +
          `<span class="fres">${esc(fmt.label)}</span>` +
          `<span class="fsz">${fmt.size_mb ? '~' + fmt.size_mb + ' MB' : '—'}</span>`;

        /* Per-card mouse-tracking 3-D tilt */
        fc.addEventListener('mousemove', e => {
          if (window.innerWidth < 520) return;
          const r  = fc.getBoundingClientRect();
          const x  = (e.clientX - r.left  - r.width  / 2) / (r.width  / 2);
          const y  = (e.clientY - r.top   - r.height / 2) / (r.height / 2);
          fc.style.transform     = `perspective(260px) rotateX(${-y*20}deg) rotateY(${x*20}deg) scale(1.07) translateZ(10px)`;
          fc.style.boxShadow     = `${-x*14}px ${-y*14}px 28px rgba(0,0,0,.45), 0 0 22px rgba(255,0,0,.18)`;
          fc.style.borderColor   = 'rgba(255,255,255,.28)';
        });
        fc.addEventListener('mouseleave', () => {
          fc.style.transform   = fc.classList.contains('sel') ? 'translateY(-5px) scale(1.02)' : '';
          fc.style.boxShadow   = '';
          fc.style.borderColor = '';
        });

        fc.addEventListener('click', () => {
          document.querySelectorAll('.fcard').forEach(c => {
            c.classList.remove('sel');
            c.style.transform = c.style.boxShadow = '';
          });
          fc.classList.add('sel');
          selFmt = fmt.format_key;
          dlBtn.disabled = false;
          dlTxt.textContent = `Download ${esc(fmt.label)}`;
        });

        fgrid.appendChild(fc);
      });

      qsec.classList.remove('hidden');
      clrSt();
    } catch {
      st('Network error — is the server running?', 'error');
    } finally {
      checkBtn.disabled = false;
      checkBtn.innerHTML =
        `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>Check`;
    }
  }

  /* ── Step 2: Download ── */
  dlBtn.addEventListener('click', async () => {
    if (!selFmt) return;
    if (pollTimer) { clearTimeout(pollTimer); pollTimer = null; }

    dlBtn.disabled = true;
    dlTxt.textContent = 'Starting…';
    st('<span class="sp"></span>Queuing download…', 'info');
    resetProgress();

    try {
      const body = new FormData();
      body.append('url', urlEl.value.trim());
      body.append('format_id', selFmt);
      const res  = await fetch('/download', { method:'POST', body });
      const data = await res.json();
      if (!res.ok) {
        st('⚠ ' + esc(data.error || 'Bad request.'), 'error');
        dlBtn.disabled = false; dlTxt.textContent = 'Try Again'; return;
      }
      poll(data.job_id);
    } catch {
      st('Network error. Please try again.', 'error');
      dlBtn.disabled = false; dlTxt.textContent = 'Try Again';
    }
  });

  /* ── Polling ── */
  async function poll(jobId) {
    try {
      const res  = await fetch('/status/' + jobId);
      const data = await res.json();

      if (data.status === 'downloading') {
        const pct = data.progress || 0;
        progBar.style.width = pct + '%';
        progPct.textContent  = pct.toFixed(1) + '%';
        progDl.textContent   = fmtBytes(data.downloaded_bytes);
        progSpd.textContent  = data.speed_bytes ? fmtBytes(data.speed_bytes) + '/s' : '—';
        progEta.textContent  = fmtEta(data.eta_seconds);
        // Switch label when video stream done (past 50%)
        progPhase.textContent = pct >= 50 ? 'Downloading audio…' : 'Downloading video…';
        progSec.classList.remove('hidden');
        clrSt();
        pollTimer = setTimeout(() => poll(jobId), 800);

      } else if (data.status === 'completed') {
        progBar.style.width = '100%';
        progPct.textContent = '100%';
        progPhase.textContent = 'Done!';
        progSpd.textContent = '—';
        progEta.textContent = '—';
        setTimeout(() => progSec.classList.add('hidden'), 1500);
        const a = Object.assign(document.createElement('a'), { href:'/file/'+jobId, download: data.filename||'video.mp4' });
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        st('✓ Downloading: <strong>' + esc(data.filename) + '</strong>', 'success');
        dlBtn.disabled = false; dlTxt.textContent = 'Download Again';

      } else if (data.status === 'failed') {
        resetProgress();
        st('⚠ ' + esc(data.error || 'Download failed.'), 'error');
        dlBtn.disabled = false; dlTxt.textContent = 'Try Again';

      } else {
        // pending — not started yet
        pollTimer = setTimeout(() => poll(jobId), 2000);
      }
    } catch {
      resetProgress();
      st('Lost connection while checking status.', 'error');
      dlBtn.disabled = false; dlTxt.textContent = 'Try Again';
    }
  }
</script>
</body>
</html>
